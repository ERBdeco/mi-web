  function updatePlaceholders() {
    const t = translations[currentLanguage];
    const inputColorLona = document.getElementById("input-color-lona");
    const inputAncho = document.getElementById("input-ancho");
    const inputAltura = document.getElementById("input-altura");

    if (inputColorLona) inputColorLona.placeholder = t.placeholder_color_lona;
    if (inputAncho) inputAncho.placeholder = t.placeholder_ancho;
    if (inputAltura) inputAltura.placeholder = t.placeholder_altura;

    if (campoSalida) {
      if (producto === "bioclimatica" || producto === "compact") {
        campoSalida.placeholder = t.placeholder_largo;
      } else {
        campoSalida.placeholder = t.placeholder_salida;
      }
    }
  }

  function updateDynamicTexts() {
    const t = translations[currentLanguage];

    if (producto === "bioclimatica") {
      titulo.textContent = t.bio_title;
      descripcion.textContent = t.bio_desc;
    } else if (producto === "compact") {
      titulo.textContent = t.compact_title;
      descripcion.textContent = t.compact_desc;
    } else if (producto === "concept") {
      titulo.textContent = t.concept_title;
      descripcion.textContent = t.default_desc;
    } else if (producto === "smart") {
      titulo.textContent = t.smart_title;
      descripcion.textContent = t.default_desc;
    } else if (producto === "cofre") {
      titulo.textContent = t.cofre_title;
      descripcion.textContent = t.default_desc;
    } else if (producto === "vertical") {
      titulo.textContent = t.vertical_title;
      descripcion.textContent = t.default_desc;
    } else if (producto === "veranda") {
      titulo.textContent = t.veranda_title;
      descripcion.textContent = t.default_desc;
    } else {
      titulo.textContent = t.default_title;
      descripcion.textContent = t.default_desc;
    }
  }

  function translatePage(lang){
    document.querySelectorAll("[data-translate]").forEach(el => {
      const key = el.dataset.translate;
      if (translations[lang] && translations[lang][key]) {
        el.innerHTML = translations[lang][key];
      }
    });

    updateDynamicTexts();
    updatePlaceholders();

    const languageHidden = document.getElementById("language-hidden");
    if (languageHidden) {
      languageHidden.value = lang;
    }

    const subjectMap = {
      es: {
        default: "Nuevo presupuesto desde ERB Deco",
        bioclimatica: "Nuevo presupuesto - Pérgola Bioclimática",
        compact: "Nuevo presupuesto - Pérgola Compact",
        concept: "Nuevo presupuesto - Toldo Concept",
        smart: "Nuevo presupuesto - Toldo Smart",
        cofre: "Nuevo presupuesto - Toldo Cofre",
        vertical: "Nuevo presupuesto - Toldo Vertical",
        veranda: "Nuevo presupuesto - Toldo Veranda"
      },
      cat: {
        default: "Nou pressupost des d'ERB Deco",
        bioclimatica: "Nou pressupost - Pèrgola Bioclimàtica",
        compact: "Nou pressupost - Pèrgola Compact",
        concept: "Nou pressupost - Tendal Concept",
        smart: "Nou pressupost - Tendal Smart",
        cofre: "Nou pressupost - Tendal Cofre",
        vertical: "Nou pressupost - Tendal Vertical",
        veranda: "Nou pressupost - Tendal Veranda"
      }
    };

    if (subjectHidden) {
      subjectHidden.value = subjectMap[lang][producto] || subjectMap[lang].default;
    }

    document.documentElement.lang = lang === "cat" ? "ca" : "es";
  }

  function setLanguage(lang){
    currentLanguage = lang;
    localStorage.setItem("siteLanguage", lang);

    document.getElementById("btn-es").classList.toggle("active", lang === "es");
    document.getElementById("btn-cat").classList.toggle("active", lang === "cat");

    translatePage(lang);
  }

  document.getElementById("btn-es").onclick = () => setLanguage("es");
  document.getElementById("btn-cat").onclick = () => setLanguage("cat");

  // ================= PRODUCTO DESDE URL =================
  const params = new URLSearchParams(window.location.search);
  const producto = params.get("producto") || "";

  const titulo = document.getElementById("titulo-producto");
  const descripcion = document.getElementById("descripcion-producto");
  const productoHidden = document.getElementById("producto-hidden");
  const subjectHidden = document.getElementById("subject-hidden");

  const colorLamas = document.querySelector(".color-lamas");
  const coloresToldos = document.querySelector(".colores-toldos");
  const coloresBioclimatica = document.querySelector(".colores-bioclimatica");
  const tipoLona = document.querySelector(".tipo-lona");
  const lonaBox = document.querySelector(".lona-box");
  const accionamientoBox = document.querySelector(".accionamiento-box");
  const extrasToldos = document.querySelector(".extras-toldos");
  const extrasBioclimatica = document.querySelector(".extras-bioclimatica");
  const alturaBox = document.querySelector(".altura-box");
  const campoSalida = document.getElementById("campo-salida");

  if (productoHidden) {
    productoHidden.value = producto;
  }

  if (producto === "bioclimatica") {
    if (colorLamas) colorLamas.style.display = "block";
    if (tipoLona) tipoLona.style.display = "none";
    if (lonaBox) lonaBox.style.display = "none";
    if (accionamientoBox) accionamientoBox.style.display = "none";
    if (extrasToldos) extrasToldos.style.display = "none";
    if (extrasBioclimatica) extrasBioclimatica.style.display = "block";
    if (alturaBox) alturaBox.style.display = "block";
    if (coloresToldos) coloresToldos.style.display = "none";
    if (coloresBioclimatica) coloresBioclimatica.style.display = "block";
  }
  else if (producto === "compact") {
    if (coloresToldos) coloresToldos.style.display = "none";
    if (coloresBioclimatica) coloresBioclimatica.style.display = "block";
    if (colorLamas) colorLamas.style.display = "none";
    if (tipoLona) tipoLona.style.display = "none";
    if (lonaBox) lonaBox.style.display = "block";
    if (accionamientoBox) accionamientoBox.style.display = "none";
    if (extrasToldos) extrasToldos.style.display = "none";
    if (extrasBioclimatica) extrasBioclimatica.style.display = "block";
    if (alturaBox) alturaBox.style.display = "block";
  }

  // ================= SLIDER FONDO =================
  const slides = document.querySelectorAll(".budget-bg-slide");
  let currentSlide = 0;

  if (slides.length > 1) {
    setInterval(() => {
      slides[currentSlide].classList.remove("active");
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add("active");
    }, 15000);
  }

  // ================= EXTRAS MOTOR =================
  const accionamientoSelect = document.getElementById("accionamiento");
  const extrasMotor = document.getElementById("extras-motor");

  function actualizarExtras() {
    if (!accionamientoSelect || !extrasMotor) return;

    if (accionamientoSelect.value === "Manual") {
      extrasMotor.style.display = "none";
    } else {
      extrasMotor.style.display = "flex";
    }
  }

  if (accionamientoSelect) {
    accionamientoSelect.addEventListener("change", actualizarExtras);
    actualizarExtras();
  }

  // ================= NAV MENU =================
  const menuToggle = document.getElementById("menu-toggle");
  const navLinks = document.getElementById("nav-links");

  if (menuToggle && navLinks) {
    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("active");
    });
  }

  // ================= ENVÍO AJAX A FORMSPREE =================
  const form = document.getElementById("budget-form");
  const statusBox = document.getElementById("form-status");

  if (form) {
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const submitButton = form.querySelector('button[type="submit"]');
      const originalButtonText = submitButton ? translations[currentLanguage].btn_solicitar : "";

      if (statusBox) {
        statusBox.textContent = translations[currentLanguage].sending_budget;
      }

      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = translations[currentLanguage].sending_button;
      }

      try {
        const formData = new FormData(form);

        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = "gracias.html";
        } else {
          if (statusBox) {
            statusBox.textContent = data.errors
              ? data.errors.map(error => error.message).join(", ")
              : translations[currentLanguage].submit_error;
          }

          if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = originalButtonText;
          }
        }
      } catch (error) {
        if (statusBox) {
          statusBox.textContent = translations[currentLanguage].connection_error;
        }

        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = originalButtonText;
        }
      }
    });
  }

  const savedLanguage = localStorage.getItem("siteLanguage");

  if(savedLanguage === "cat" || savedLanguage === "es"){
    setLanguage(savedLanguage);
  } else {
    setLanguage("es");
  }
</script>

</body>
</html>
