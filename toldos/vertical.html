<div class="language-switch">
<button id="btn-es" class="active">ES</button>
<button id="btn-cat">CAT</button>
</div>


<script>
document.querySelectorAll(".product-slider").forEach(slider=>{
const images = JSON.parse(slider.dataset.images);
const imgDiv = slider.querySelector(".product-image");
const left = slider.querySelector(".left");
const right = slider.querySelector(".right");

let index=0;

function setImage(i){
imgDiv.style.backgroundImage = `url('${images[i]}')`;
}

setImage(index);

right.addEventListener("click",(e)=>{
e.preventDefault();
e.stopPropagation();
index=(index+1)%images.length;
setImage(index);
});

left.addEventListener("click",(e)=>{
e.preventDefault();
e.stopPropagation();
index=(index-1+images.length)%images.length;
setImage(index);
});
});
</script>


<script>

let currentLanguage="es";

const translations={

es:{

nav_inicio:"Inicio",
nav_galeria:"Galería",
nav_nosotros:"Nosotros",
nav_contacto:"Contacto",

v1_title:"Toldo Vertical Básico / Balcón",
v1_desc:"Solución sencilla y funcional para protección solar en balcones y terrazas.",

v2_title:"Toldo Vertical Guía ZIP",
v2_desc:"Sistema con cierre hermético ideal para viento y máxima protección solar.",

v3_title:"Toldo Vertical Guía con Varilla",
v3_desc:"Sistema vertical con guías y varilla interna.",

price:"Consultar precio"

},

cat:{

nav_inicio:"Inici",
nav_galeria:"Galeria",
nav_nosotros:"Nosaltres",
nav_contacto:"Contacte",

v1_title:"Tendal Vertical Bàsic / Balcó",
v1_desc:"Solució senzilla i funcional per a protecció solar en balcons i terrasses.",

v2_title:"Tendal Vertical Guia ZIP",
v2_desc:"Sistema amb tancament hermètic ideal per al vent i màxima protecció solar.",

v3_title:"Tendal Vertical Guia amb Varilla",
v3_desc:"Sistema vertical amb guies i varilla interna.",

price:"Consultar preu"

}

};

function translatePage(lang){

document.querySelectorAll("[data-translate]").forEach(el=>{
const key=el.dataset.translate;
if(translations[lang][key]){
el.innerHTML=translations[lang][key];
}
});

document.documentElement.lang = lang==="cat" ? "ca" : "es";

}

function setLanguage(lang){

currentLanguage=lang;

localStorage.setItem("siteLanguage",lang);

document.getElementById("btn-es").classList.toggle("active",lang==="es");
document.getElementById("btn-cat").classList.toggle("active",lang==="cat");

translatePage(lang);

}

document.getElementById("btn-es").onclick=()=>setLanguage("es");
document.getElementById("btn-cat").onclick=()=>setLanguage("cat");

const savedLanguage=localStorage.getItem("siteLanguage");

if(savedLanguage==="cat"||savedLanguage==="es"){
setLanguage(savedLanguage);
}else{
setLanguage("es");
}

</script>
