  </div>

<section class="product-bar">
  <a href="#" class="product-item active" data-category="pergolas" data-translate="cat_pergolas">Pérgolas</a>

  <a href="#" class="product-item" data-category="cortinas" data-translate="cat_cortinas">Cortinas</a>
  <a href="#" class="product-item" data-category="mosquiteras" data-translate="cat_mosquiteras">Mosquiteras</a>
</section>

<section class="products-section">
  <div class="products-container" id="products-container"></div>
</section>

<div class="language-switch">
  <button id="btn-es" class="active">ES</button>
  <button id="btn-cat">CAT</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let currentLanguage = localStorage.getItem("siteLanguage") || "es";
let currentCategory = localStorage.getItem("siteCategory") || "pergolas";
let currentSlide = 0;
let interval;

/* ================= HERO ================= */

const heroImages={
  pergolas:["images/bioclimatica1.jpeg","images/bioclimatica2.jpeg","images/bioclimatica3.jpeg"],
  toldos:["images/toldocofre.png","images/instalaciones/instalacion-toldo-veranda-hostalric-1.jpeg","images/toldocofre1.png"],
  cortinas:["images/cortina1.jpg","images/cortina2.jpg","images/cortina3.jpg"],
  mosquiteras:[
    "images/instalaciones/mosquitera-enrrollable-3.jpeg",
    "images/instalaciones/mosquitera-plisada2.jpeg",
    "images/instalaciones/mosquitera-especial1.jpeg"
  ]
};

const slider=document.getElementById("hero-slider");
const slides=document.querySelectorAll(".slide-bg");
if(slides.length===0) return;

function loadHero(category){
  currentSlide=0;
  slider.style.transition="none";
  slider.style.transform="translateX(0%)";

  slides.forEach((slide,index)=>{
    const images=heroImages[category];
    const img=index<images.length?images[index]:images[0];
    slide.style.backgroundImage=`url('${img}')`;
  });

  startSlider();
}

function startSlider(){
  clearInterval(interval);
  interval=setInterval(()=>{
    currentSlide++;
    slider.style.transition="transform 1.5s ease-in-out";
    slider.style.transform=`translateX(-${currentSlide*100}%)`;

    if(currentSlide===slides.length-1){
      setTimeout(()=>{
        slider.style.transition="none";
        currentSlide=0;
        slider.style.transform="translateX(0%)";
      },1500);
    }
  },8000);
}

/* ================= PRODUCTOS ================= */

const productsData={
  pergolas:[
    {
      images:["images/bioclimatica1.jpeg"],
      link:"pergolas/bioclimatica.html",
      es:{t:"Pérgola Bioclimática",d:"Sistema bioclimático premium."},
      cat:{t:"Pèrgola Bioclimàtica",d:"Sistema bioclimàtic premium."}
    },
    {
      images:["images/compact1.jpeg"],
      link:"pergolas/productos/pergola-compact.html",
      es:{t:"Pérgola Tensada",d:"Diseño elegante y resistente."},
      cat:{t:"Pèrgola Tensada",d:"Disseny elegant i resistent."}
    },
    {
      images:["images/zerro1.jpeg","images/zerro4.jpeg","images/zerro5.jpeg"],
      link:"pergolas/productos/pergola-tensada-inclinacion.html",
      es:{t:"Pérgola Tensada Con Inclinación",d:"Minimalismo y precisión."},
      cat:{t:"Pèrgola Tensada Amb inclinació",d:"Minimalisme i precisió."}
    },
   {
      images:["images/toldo-corredero1.jpeg","images/toldo-corredero2.jpeg"],
      link:"pergolas/pergola-toldo-corredero.html",
      es:{t:"Pérgola Toldo Corredero",d:"Minimalismo y precisión."},
      cat:{t:"Pèrgola Tendal Correder",d:"Minimalisme i precisió."}
    }
  ],

  toldos:[
    {
      images:["images/2026_002.jpg","images/2036_009.jpg","images/2036_010.jpg"],
      link:"toldos/brazos-articulados.html",
      es:{t:"Brazos Articulados",d:"Versatilidad total."},
      cat:{t:"Braços Articulats",d:"Versatilitat total."}
    },
    {
      images:["images/5026_002.jpg","images/5026_004.jpg","images/5036_011.jpg","images/5036_013.jpg","images/5066_002.png"],
      link:"toldos/cofre.html",
      es:{t:"Cofre",d:"Máxima protección."},
      cat:{t:"Cofre",d:"Màxima protecció."}
    },
    {
      images:["images/4006_003.jpg","images/4006_002.jpg","images/4009_006.png","images/1020_003.jpg"],
      link:"toldos/vertical.html",
      es:{t:"Vertical",d:"Protección frontal elegante."},
      cat:{t:"Vertical",d:"Protecció frontal elegant."}
    },
    {
      images:["images/instalaciones/instalacion-toldo-veranda-hostalric-1.jpeg"],
      link:"toldos/veranda.html",
      es:{t:"Veranda",d:"Ideal para techos y pérgolas."},
      cat:{t:"Veranda",d:"Ideal per a sostres i pèrgoles."}
    }
  ],
  mosquiteras:[
    {
      images:["images/instalaciones/mosquitera-enrrollable-3.jpeg"],
      link:"#",
      es:{t:"Mosquitera Ventana Autoenrollable",d:"Solución práctica y discreta para ventanas."},
      cat:{t:"Mosquitera Finestra Autoenrotllable",d:"Solució pràctica i discreta per a finestres."}
    },
    {
      images:["images/instalaciones/mosquitera-plisada-3.jpeg"],
      link:"#",
      es:{t:"Mosquitera Puerta Corredera",d:"Ideal para accesos de paso frecuente y puertas exteriores."},
      cat:{t:"Mosquitera Porta Corredissa",d:"Ideal per a accessos de pas freqüent i portes exteriors."}
    },
    {
      images:["images/instalaciones/mosquitera-especial1.jpeg"],
      link:"#",
      es:{t:"Mosquitera Forma Especial",d:"Diseñada para huecos con formas especiales o medidas singulares."},
      cat:{t:"Mosquitera Forma Especial",d:"Dissenyada per a obertures amb formes especials o mides singulars."}
    }
  ],
  cortinas:[
  {
    images:["images/cortina-enrollable1.jpg","images/cortina-enrollable2.jpg"],
    link:"cortinas/enrollable.html",
    es:{t:"Cortina Enrollable",d:"Sistema moderno y minimalista para controlar la luz."},
    cat:{t:"Cortina Enrotllable",d:"Sistema modern i minimalista per controlar la llum."}
  },
  {
    images:["images/cortina-noche-dia1.jpg","images/cortina-noche-dia2.jpg"],
    link:"cortinas/noche-dia.html",
    es:{t:"Cortina Noche y Día",d:"Control total de luminosidad con diseño elegante."},
    cat:{t:"Cortina Nit i Dia",d:"Control total de la llum amb disseny elegant."}
  },
  {
    images:["images/cortina-confeccion1.jpg","images/cortina-confeccion2.jpg"],
    link:"cortinas/confeccion.html",
    es:{t:"Cortina Confección",d:"Cortinas textiles a medida para cualquier espacio."},
    cat:{t:"Cortina Confecció",d:"Cortines tèxtils fetes a mida per a qualsevol espai."}
  },
  {
    images:["images/cortina-accesorios1.jpg"],
    link:"cortinas/accesorios.html",
    es:{t:"Accesorios",d:"Rieles, barras y complementos para cortinas."},
    cat:{t:"Accessoris",d:"Rails, barres i complements per a cortines."}
  }
]
};

function loadProducts(category){
  const container=document.getElementById("products-container");
  container.innerHTML="";

  productsData[category].forEach((p,index)=>{

    container.innerHTML+=`
      <a href="${p.link}" class="product-card">
        <div class="product-slider">
          ${p.images.length>1?`<button class="arrow left">‹</button>`:""}
          <div class="product-image" 
               data-images='${JSON.stringify(p.images)}'
               data-position="0"
               style="background-image:url('${p.images[0]}')">
          </div>
          ${p.images.length>1?`<button class="arrow right">›</button>`:""}
        </div>

        <div class="product-info">
          <h3>${p[currentLanguage].t}</h3>
          <p>${p[currentLanguage].d}</p>
        </div>
      </a>
    `;
  });

  activateSliders();
}

function activateSliders(){
  document.querySelectorAll(".product-slider").forEach(slider=>{
    const imageDiv=slider.querySelector(".product-image");
    const left=slider.querySelector(".left");
    const right=slider.querySelector(".right");

    if(!left || !right) return;

    const images=JSON.parse(imageDiv.dataset.images);

    left.addEventListener("click",(e)=>{
      e.preventDefault(); e.stopPropagation();
      let pos=parseInt(imageDiv.dataset.position);
      pos=pos<=0?images.length-1:pos-1;
      imageDiv.dataset.position=pos;
      imageDiv.style.backgroundImage=`url('${images[pos]}')`;
    });

    right.addEventListener("click",(e)=>{
      e.preventDefault(); e.stopPropagation();
      let pos=parseInt(imageDiv.dataset.position);
      pos=pos>=images.length-1?0:pos+1;
      imageDiv.dataset.position=pos;
      imageDiv.style.backgroundImage=`url('${images[pos]}')`;
    });
  });
}

/* ================= TRADUCCIÓN ================= */

const translations={
  es:{
    nav_inicio:"Inicio",
    nav_galeria:"Galería",
    nav_nosotros:"Nosotros",
    nav_contacto:"Contacto",
    hero_title:"Diseño. Precisión.<br>Elegancia Exterior.",
    hero_subtitle:"ERB · Barcelona & Girona",
    hero_button:"Solicitar Estudio Personalizado",
    cat_pergolas:"Pérgolas",
    cat_toldos:"Toldos",
    cat_cortinas:"Cortinas",
    cat_mosquiteras:"Mosquiteras"
  },
  cat:{
    nav_inicio:"Inici",
    nav_galeria:"Galeria",
    nav_nosotros:"Nosaltres",
    nav_contacto:"Contacte",
    hero_title:"Disseny. Precisió.<br>Elegància Exterior.",
    hero_subtitle:"ERB · Barcelona & Girona",
    hero_button:"Sol·licitar Estudi Personalitzat",
    cat_pergolas:"Pèrgoles",
    cat_toldos:"Tendals",
    cat_cortinas:"Cortines",
    cat_mosquiteras:"Mosquiteres"
  }
};

function translatePage(lang){
  document.querySelectorAll("[data-translate]").forEach(el=>{
    const key=el.dataset.translate;
    if(translations[lang][key]) el.innerHTML=translations[lang][key];
  });

  document.documentElement.lang = lang === "cat" ? "ca" : "es";
  loadProducts(currentCategory);
}

function setLanguage(lang){
  currentLanguage = lang;
  localStorage.setItem("siteLanguage", lang);

  document.getElementById("btn-es").classList.toggle("active", lang === "es");
  document.getElementById("btn-cat").classList.toggle("active", lang === "cat");

  translatePage(lang);
}

document.getElementById("btn-es").onclick=()=>{
  setLanguage("es");
};

document.getElementById("btn-cat").onclick=()=>{
  setLanguage("cat");
};

document.querySelectorAll(".product-item").forEach(item=>{
  item.addEventListener("click",e=>{
    e.preventDefault();
    document.querySelectorAll(".product-item").forEach(i=>i.classList.remove("active"));
    item.classList.add("active");
    currentCategory = item.dataset.category;
    localStorage.setItem("siteCategory", currentCategory);
    loadHero(currentCategory);
    loadProducts(currentCategory);
  });
});

document.querySelectorAll(".product-item").forEach(item=>{
  item.classList.remove("active");
  if(item.dataset.category === currentCategory){
    item.classList.add("active");
  }
});

loadHero(currentCategory);
loadProducts(currentCategory);

if(currentLanguage === "cat" || currentLanguage === "es"){
  setLanguage(currentLanguage);
} else {
  setLanguage("es");
}

/* ================= MENU HAMBURGUESA ================= */

const menuToggle = document.querySelector(".menu-toggle");
const navLinks = document.querySelector(".nav-links");

if(menuToggle){
  menuToggle.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  });
}

});
</script>

</body>
